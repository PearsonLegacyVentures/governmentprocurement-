name: Publish source-verified Opportunity Radar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/radar.mjs'
      - 'tests/radar.test.mjs'
      - 'data/sources/bonfire-*.json'
      - '.github/workflows/opportunity-radar.yml'
permissions:
  contents: write
concurrency:
  group: procurement-opportunity-radar
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and matching logic
        run: |
          node --check scripts/radar.mjs
          node --test tests/radar.test.mjs
      - name: Normalize only when official source is not older than published snapshot
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {normalizeSnapshot} from './scripts/radar.mjs';
          const source=JSON.parse(readFileSync('data/sources/bonfire-2026-10-13.json','utf8'));
          const published=JSON.parse(readFileSync('data/public/opportunities.json','utf8'));
          if(Date.parse(source.captured_at)<Date.parse(published.metadata.captured_at)){
            console.log('Skipped historical 2026-10-13 capture: newer',published.metadata.checked_date,'public snapshot is already published.');
          }else{
            const data=normalizeSnapshot(source);
            if(data.opportunities.length!==source.opportunities.length)throw Error('Source count mismatch');
            writeFileSync('data/public/opportunities.json',JSON.stringify(data,null,2)+'\n');
            console.log('Published',data.opportunities.length,'opportunities from',data.metadata.checked_date);
          }
          JS
      - name: Commit public radar dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public/opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish 2026-10-13 Bonfire open opportunities snapshot'
            git fetch origin main
            git rebase origin/main
            git push
          fi
