name: Import Bahamas award reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ingest.yml'
  schedule:
    - cron: '21 11 * * 1'
concurrency:
  group: procurement-awards-import
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Import official government awards
        run: python scripts/procurement.py --output data/public --max-pages 45 --max-reports 40
      - name: Upload audit and output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-ingestion-audit
          path: data/public/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit verified public data only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public/awards.json data/public/import_status.json data/public/source_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: ingest official Bahamas procurement award reports'
            git push
          fi
