name: Probe official award workbook
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and inspect official July 2026 workbook
        run: |
          python - <<'PY'
          import hashlib, sys
          from scripts.procurement import fetch, read_xlsx, detect_header, extract_awards
          u='https://mofvendors.gov.bs/wp-content/uploads/2026/09/BAHAMAS-PUBLIC-PROCUREMENT-PROJECT-AWARDS-REPORT-JULY-1-31-2026.xlsx'
          b=fetch(u,retries=0)
          print('NETWORK_DOWNLOAD_OK',len(b),'SHA256',hashlib.sha256(b).hexdigest())
          for name, rows in read_xlsx(b):
              header, fields=detect_header(rows)
              print('SHEET',name,'rows',len(rows),'detected_header',header,'fields',fields)
              for i,row in enumerate(rows[:18],1):
                  print('PREVIEW_ROW',i,[str(x)[:80] for x in row[:15]])
          report={'url':u,'notice_url':'https://mofvendors.gov.bs/public-notice-procurement-department-september-2026/','period':'2026-07'}
          award_rows,diag=extract_awards(b,report)
          print('EXTRACTED_AWARD_RECORDS',len(award_rows),'DIAGNOSTICS',diag)
          summary_url='https://mofvendors.gov.bs/wp-content/uploads/2026/09/BAHAMAS-PUBLIC-PROCUREMENT-AWARDED-CONTRACTS-SUMMARY-REPORT-JULY-1-31-2026.xlsx'
          try:
              summary=fetch(summary_url,retries=0)
              print('SUMMARY_DOWNLOAD_OK',len(summary),'SHA256',hashlib.sha256(summary).hexdigest())
              for sheet, rows in read_xlsx(summary):
                  print('SUMMARY_SHEET',sheet,'rows',len(rows))
                  for i,row in enumerate(rows[:20],1):
                      print('SUMMARY_PREVIEW_ROW',i,[str(x)[:80] for x in row[:15]])
          except Exception as exc:
              print('SUMMARY_PROBE_FAILED',type(exc).__name__,str(exc))
          other=[
              ('2025-03','https://mofvendors.gov.bs/wp-content/uploads/2025/05/Bahamas-Public-Procurement-Awarded-Contracts-Summary-Report-March-1-31-2025.xlsx'),
              ('2025-06','https://mofvendors.gov.bs/wp-content/uploads/2025/08/Bahamas-Public-Procurement-Awarded-Contract-Summary-Report-June-1-30-2025.xlsx'),
              ('2026-01','https://mofvendors.gov.bs/wp-content/uploads/2026/03/Bahamas-Public-Procurement-Awarded-Contracts-Summary-Report-January-1-31-2026.xlsx')
          ]
          for period,url in other:
              try:
                  binary=fetch(url,retries=0)
                  for sheet, rows in read_xlsx(binary):
                      print('ALT_SUMMARY',period,'sheet',sheet,'rows',len(rows))
                      for i,row in enumerate(rows[:12],1):
                          print('ALT_ROW',period,i,[str(x)[:85] for x in row[:16]])
              except Exception as exc:
                  print('ALT_FAILED',period,type(exc).__name__,str(exc))
          PY
